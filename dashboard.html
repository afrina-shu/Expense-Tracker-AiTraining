<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Dashboard</title>
<style>
  :root {
    --bg: #0b1020; --card: rgba(255,255,255,.06); --card-b: rgba(255,255,255,.10);
    --text: #eef1ff; --muted: #9aa3c7; --accent1: #6366f1; --accent2: #a855f7; --accent3: #ec4899;
    --good: #4ade80; --bad: #fb7185; --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { padding: 4px; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .shell { position: relative; overflow: hidden; border-radius: 28px; padding: 22px;
    background: radial-gradient(900px 500px at 8% -10%, rgba(99,102,241,.35), transparent 60%),
                radial-gradient(700px 500px at 100% 0%, rgba(236,72,153,.22), transparent 55%), var(--bg); }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .2px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px;
    background: linear-gradient(135deg, var(--accent1), var(--accent3)); box-shadow: 0 8px 24px rgba(168,85,247,.45); }
  .pill { padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid var(--card-b); backdrop-filter: blur(10px); }

  .grid { display: grid; gap: 16px; grid-template-columns: 1.15fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--radius); padding: 20px;
    backdrop-filter: blur(14px); animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  .card h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; } .card:nth-child(4) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* hero */
  .hero { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 55%, #ec4899 100%); border: none; position: relative; overflow: hidden;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 190px; }
  .hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -70px; top: -90px; border-radius: 50%;
    background: rgba(255,255,255,.12); }
  .hero small { opacity: .85; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .amount { font-size: clamp(32px, 6vw, 46px); font-weight: 800; margin: 6px 0 10px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .amount span { font-size: .5em; font-weight: 600; opacity: .8; margin-right: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; backdrop-filter: blur(6px); }
  .ring { position: relative; width: 118px; height: 118px; flex: none; z-index: 1; }
  .ring svg { transform: rotate(-90deg); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font-size: 22px; } .ring .mid i { font-style: normal; font-size: 11px; opacity: .85; }

  /* donut */
  .donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .donut { position: relative; width: 168px; height: 168px; flex: none; }
  .donut svg { transform: rotate(-90deg); }
  .donut circle.seg { transition: stroke-width .2s, opacity .2s; cursor: pointer; }
  .donut .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .donut .center b { font-size: 19px; font-variant-numeric: tabular-nums; } .donut .center i { font-style: normal; font-size: 12px; color: var(--muted); }
  .legend { flex: 1; min-width: 170px; display: grid; gap: 6px; }
  .lrow { display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 10px;
    font-size: 13.5px; cursor: default; transition: background .15s; }
  .lrow:hover, .lrow.on { background: rgba(255,255,255,.08); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .lrow .pc { color: var(--muted); font-size: 12px; width: 36px; text-align: right; }
  .lrow .val { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* daily bars */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 6px; }
  .bar { flex: 1; min-width: 3px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent2), var(--accent1)); opacity: .55;
    height: 4px; transition: height .8s cubic-bezier(.2,.8,.2,1), opacity .15s; }
  .bar.has { opacity: .95; } .bar.today { background: linear-gradient(180deg, var(--accent3), var(--accent2)); opacity: 1; }
  .bar:hover { opacity: 1; filter: brightness(1.25); }
  .readout { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .readout b { color: var(--text); }

  /* recent */
  .tx { display: grid; gap: 4px; }
  .row { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 8px 6px; border-radius: 14px; transition: background .15s; }
  .row:hover { background: rgba(255,255,255,.07); }
  .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; }
  .row .t { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .row .a { font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 26px 8px; font-size: 14px; line-height: 1.6; }
  .empty big { display: block; font-size: 38px; margin-bottom: 6px; }
  .span2 { grid-column: 1 / -1; }

  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .hero { flex-direction: column; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="logo">💸</div><div>Expense Tracker<div style="font-weight:400;font-size:12px;color:var(--muted)">AI-powered · live from SQLite</div></div></div>
    <div class="pill" id="month"></div>
  </div>

  <div class="grid">
    <section class="card hero">
      <div>
        <small>Spent this month</small>
        <div class="amount"><span id="cur"></span><b id="total">0.00</b></div>
        <div class="chips"><div class="chip" id="chipCount"></div><div class="chip" id="chipAvg"></div><div class="chip" id="chipTop"></div></div>
      </div>
      <div class="ring" id="ringBox" hidden>
        <svg width="118" height="118" viewBox="0 0 118 118">
          <circle cx="59" cy="59" r="50" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="11"/>
          <circle id="ringArc" cx="59" cy="59" r="50" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="0 999"
                  style="transition: stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)"/>
        </svg>
        <div class="mid"><b id="ringPct">0%</b><i id="ringLbl">of budget</i></div>
      </div>
    </section>

    <section class="card">
      <h3>Where it goes</h3>
      <div id="donutBox"></div>
    </section>

    <section class="card">
      <h3>Daily spending</h3>
      <div class="bars" id="bars"></div>
      <div class="readout" id="readout">Hover a bar to see the day</div>
    </section>

    <section class="card">
      <h3>Recent expenses</h3>
      <div class="tx" id="tx"></div>
    </section>
  </div>
</div>

<script>
  // Python replaces the next line with live data (see build_payload() in app.py)
  const DATA = /*__DATA__*/{"currency":"RM","month_label":"Preview","total":0,"count":0,"budget":0,"categories":[],"daily":[],"recent":[],"today_day":1};

  const META = {
    Food: ["🍜", "#fb923c"], Transport: ["🚗", "#38bdf8"], Shopping: ["🛍️", "#f472b6"], Bills: ["💡", "#facc15"],
    Health: ["💊", "#4ade80"], Entertainment: ["🎮", "#a78bfa"], Other: ["📦", "#94a3b8"]
  };
  const meta = (c) => META[c] || META.Other;
  const fmt = (n) => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NS = "http://www.w3.org/2000/svg";

  // ---------- header + hero
  $("month").textContent = "📅 " + DATA.month_label;
  $("cur").textContent = DATA.currency;
  $("chipCount").textContent = DATA.count + (DATA.count === 1 ? " entry" : " entries");
  $("chipAvg").textContent = "avg " + DATA.currency + " " + fmt(DATA.count ? DATA.total / DATA.count : 0);
  $("chipTop").textContent = DATA.categories.length ? meta(DATA.categories[0].name)[0] + " " + DATA.categories[0].name : "No data yet";

  function countUp(node, to) {            // animated number
    if (reduce || !to) { node.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  countUp($("total"), DATA.total);

  if (DATA.budget > 0) {                  // budget ring
    $("ringBox").hidden = false;
    const pct = DATA.total / DATA.budget, C = 2 * Math.PI * 50, arc = $("ringArc");
    $("ringPct").textContent = Math.round(pct * 100) + "%";
    $("ringLbl").textContent = pct > 1 ? "over budget" : DATA.currency + " " + fmt(DATA.budget - DATA.total) + " left";
    if (pct > 1) arc.setAttribute("stroke", "#fecaca");
    setTimeout(() => arc.setAttribute("stroke-dasharray", Math.min(pct, 1) * C + " " + C), 120);
  }

  // ---------- donut + legend
  const box = $("donutBox");
  if (!DATA.categories.length) {
    const e = el("div", "empty"); e.appendChild(el("big", "", "🧾"));
    e.appendChild(document.createTextNode("No expenses yet. Tell the assistant below what you spent!"));
    box.appendChild(e);
  } else {
    const wrap = el("div", "donut-wrap"), donut = el("div", "donut"), legend = el("div", "legend");
    const R = 62, C = 2 * Math.PI * R, svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", 168); svg.setAttribute("height", 168); svg.setAttribute("viewBox", "0 0 168 168");
    const center = el("div", "center"), cb = el("b", "", DATA.currency + " " + fmt(DATA.total)), ci = el("i", "", "total");
    center.append(cb, ci);
    const segs = [], rows = [];
    const focus = (i) => {
      segs.forEach((s, j) => { s.setAttribute("stroke-width", i === j ? 26 : 20); s.style.opacity = i === null || i === j ? 1 : .35; });
      rows.forEach((r, j) => r.classList.toggle("on", i === j));
      if (i === null) { cb.textContent = DATA.currency + " " + fmt(DATA.total); ci.textContent = "total"; }
      else { cb.textContent = DATA.currency + " " + fmt(DATA.categories[i].total); ci.textContent = DATA.categories[i].name; }
    };
    let cum = 0;
    DATA.categories.forEach((c, i) => {
      const share = c.total / DATA.total, len = share * C, col = meta(c.name)[1];
      const s = document.createElementNS(NS, "circle");
      s.setAttribute("class", "seg"); s.setAttribute("cx", 84); s.setAttribute("cy", 84); s.setAttribute("r", R);
      s.setAttribute("fill", "none"); s.setAttribute("stroke", col); s.setAttribute("stroke-width", 20);
      s.setAttribute("stroke-dasharray", Math.max(len - 2, 0.5) + " " + C); s.setAttribute("stroke-dashoffset", -cum);
      s.addEventListener("mouseenter", () => focus(i)); s.addEventListener("mouseleave", () => focus(null));
      svg.appendChild(s); segs.push(s); cum += len;

      const row = el("div", "lrow"), dot = el("span", "dot"); dot.style.background = col;
      row.append(dot, el("span", "", meta(c.name)[0] + " " + c.name), el("span", "pc", Math.round(share * 100) + "%"),
                 el("span", "val", fmt(c.total)));
      row.addEventListener("mouseenter", () => focus(i)); row.addEventListener("mouseleave", () => focus(null));
      legend.appendChild(row); rows.push(row);
    });
    donut.append(svg, center); wrap.append(donut, legend); box.appendChild(wrap);
  }

  // ---------- daily bars
  const bars = $("bars"), max = Math.max(1, ...DATA.daily);
  DATA.daily.forEach((v, i) => {
    const b = el("div", "bar" + (v > 0 ? " has" : "") + (i + 1 === DATA.today_day ? " today" : ""));
    const h = v > 0 ? Math.max(8, (v / max) * 112) : 4;
    setTimeout(() => (b.style.height = h + "px"), reduce ? 0 : 60 + i * 14);
    b.addEventListener("mouseenter", () => {
      const r = $("readout"); r.textContent = "";
      r.append(el("b", "", DATA.month_label.split(" ")[0] + " " + (i + 1)), document.createTextNode(" · " + DATA.currency + " " + fmt(v)));
    });
    bars.appendChild(b);
  });

  // ---------- recent transactions
  const tx = $("tx");
  if (!DATA.recent.length) tx.appendChild(el("div", "empty", "Nothing here yet."));
  DATA.recent.forEach((r) => {
    const [emoji, col] = meta(r.category), row = el("div", "row"), ico = el("div", "ico", emoji);
    ico.style.background = col + "26"; ico.style.border = "1px solid " + col + "55";
    const mid = el("div"); mid.append(el("div", "t", r.note || r.category), el("div", "s", r.category + " · " + r.date + " · #" + r.id));
    row.append(ico, mid, el("div", "a", "−" + DATA.currency + " " + fmt(r.amount)));
    tx.appendChild(row);
  });
</script>
</body>
</html>
