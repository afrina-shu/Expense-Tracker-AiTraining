<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Dashboard</title>
<style>
  :root {
    --bg: #eef6ff; --card: #ffffff; --card-b: #d9e8fb;
    --text: #0f2a4a; --muted: #5b7694; --accent1: #2563eb; --accent2: #38bdf8; --accent3: #0ea5e9;
    --good: #16a34a; --bad: #e11d48; --radius: 22px;
    --shadow: 0 6px 24px rgba(37, 99, 235, .10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { padding: 4px; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .shell { position: relative; overflow: hidden; border-radius: 28px; padding: 22px;
    background: radial-gradient(900px 500px at 5% -10%, rgba(56,189,248,.30), transparent 60%),
                radial-gradient(700px 500px at 100% 0%, rgba(37,99,235,.14), transparent 55%), var(--bg);
    border: 1px solid var(--card-b); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .2px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2)); box-shadow: 0 8px 20px rgba(37,99,235,.30); }

  /* month navigator */
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--card-b); background: #fff;
    color: var(--accent1); font-size: 18px; line-height: 1; cursor: pointer; transition: all .15s; }
  .nav button:hover:not(:disabled) { background: var(--accent1); color: #fff; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav select { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--card-b); background: #fff;
    color: var(--accent1); font-weight: 700; font-size: 13px; cursor: pointer; outline: none; }
  .nav select:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.2); }

  .grid { display: grid; gap: 16px; grid-template-columns: 1.15fr 1fr; }
  .span2 { grid-column: 1 / -1; }
  .card { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); animation: rise .6s cubic-bezier(.2,.8,.2,1) both; min-width: 0; }
  .card h3 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 em { font-style: normal; font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--accent1); }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  .card:nth-child(4) { animation-delay: .24s; } .card:nth-child(5) { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* hero */
  .hero { background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 45%, #38bdf8 100%); border: none; color: #fff; position: relative; overflow: hidden;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 190px;
    box-shadow: 0 14px 34px rgba(37,99,235,.30); }
  .hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -70px; top: -90px; border-radius: 50%;
    background: rgba(255,255,255,.14); }
  .hero small { opacity: .9; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .amount { font-size: clamp(32px, 6vw, 46px); font-weight: 800; margin: 6px 0 10px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .amount span { font-size: .5em; font-weight: 600; opacity: .85; margin-right: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.22); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; }
  .chip.up { background: rgba(254,205,211,.9); color: #9f1239; } .chip.down { background: rgba(187,247,208,.92); color: #166534; }
  .ring { position: relative; width: 118px; height: 118px; flex: none; z-index: 1; }
  .ring svg { transform: rotate(-90deg); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font-size: 22px; } .ring .mid i { font-style: normal; font-size: 11px; opacity: .9; }

  /* donut */
  .donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .donut { position: relative; width: 168px; height: 168px; flex: none; }
  .donut svg { transform: rotate(-90deg); }
  .donut circle.seg { transition: stroke-width .2s, opacity .2s; cursor: pointer; }
  .donut .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .donut .center b { font-size: 19px; font-variant-numeric: tabular-nums; } .donut .center i { font-style: normal; font-size: 12px; color: var(--muted); }
  .legend { flex: 1; min-width: 170px; display: grid; gap: 6px; }
  .lrow { display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 10px;
    font-size: 13.5px; cursor: default; transition: background .15s; }
  .lrow:hover, .lrow.on { background: #eaf3ff; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .lrow .pc { color: var(--muted); font-size: 12px; width: 36px; text-align: right; }
  .lrow .val { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* monthly overview chart */
  #trend svg { overflow: visible; }
  #trend .slot { cursor: pointer; }
  #trend .slot:hover .hl { fill: rgba(37,99,235,.07); }
  .tlegend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .tlegend span { display: inline-flex; align-items: center; gap: 6px; }

  /* daily bars */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 6px; }
  .bar { flex: 1; min-width: 3px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent2), var(--accent1)); opacity: .5;
    height: 4px; transition: height .8s cubic-bezier(.2,.8,.2,1), opacity .15s; }
  .bar.has { opacity: .95; } .bar.today { background: linear-gradient(180deg, #0ea5e9, #1d4ed8); opacity: 1; }
  .bar:hover { opacity: 1; filter: brightness(1.1); }
  .readout { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .readout b { color: var(--text); }

  /* recent */
  .tx { display: grid; gap: 4px; max-height: 330px; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; scrollbar-color: #bcd8fa transparent; }
  .tx::-webkit-scrollbar { width: 6px; } .tx::-webkit-scrollbar-thumb { background: #bcd8fa; border-radius: 6px; }
  .row { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 8px 6px; border-radius: 14px; transition: background .15s; }
  .row:hover { background: #eef6ff; }
  .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; }
  .row .t { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .row .a { font-weight: 700; font-variant-numeric: tabular-nums; color: #1e3a8a; }
  .empty { text-align: center; color: var(--muted); padding: 26px 8px; font-size: 14px; line-height: 1.6; }
  .empty big { display: block; font-size: 38px; margin-bottom: 6px; }

  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .hero { flex-direction: column; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="logo">💸</div><div>Expense Tracker<div style="font-weight:400;font-size:12px;color:var(--muted)">AI-powered · live from SQLite</div></div></div>
    <div class="nav">
      <button id="prev" title="Previous month" aria-label="Previous month">‹</button>
      <select id="monthSel" aria-label="Choose month"></select>
      <button id="next" title="Next month" aria-label="Next month">›</button>
    </div>
  </div>

  <div class="grid">
    <section class="card hero">
      <div>
        <small id="heroLbl">Spent this month</small>
        <div class="amount"><span id="cur"></span><b id="total">0.00</b></div>
        <div class="chips"><div class="chip" id="chipCount"></div><div class="chip" id="chipAvg"></div><div class="chip" id="chipTop"></div><div class="chip" id="chipChg" hidden></div></div>
      </div>
      <div class="ring" id="ringBox" hidden>
        <svg width="118" height="118" viewBox="0 0 118 118">
          <circle cx="59" cy="59" r="50" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="11"/>
          <circle id="ringArc" cx="59" cy="59" r="50" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="0 999"
                  style="transition: stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)"/>
        </svg>
        <div class="mid"><b id="ringPct">0%</b><i id="ringLbl">of budget</i></div>
      </div>
    </section>

    <section class="card">
      <h3>Where it goes <em id="catMonth"></em></h3>
      <div id="donutBox"></div>
    </section>

    <section class="card span2">
      <h3>Monthly overview <em>click a month to open it</em></h3>
      <div id="trend"></div>
      <div class="tlegend" id="tlegend"></div>
      <div class="readout" id="trendRead"></div>
    </section>

    <section class="card">
      <h3>Daily spending <em id="dailyMonth"></em></h3>
      <div class="bars" id="bars"></div>
      <div class="readout" id="readout">Hover a bar to see the day</div>
    </section>

    <section class="card">
      <h3>Expenses <em id="txMonth"></em></h3>
      <div class="tx" id="tx"></div>
    </section>
  </div>
</div>

<script>
  // Python replaces the next line with live data (see build_payload() in app.py)
  const DATA = /*__DATA__*/{"currency":"RM","budget":0,"current":"","today_day":1,"months":[]};

  const META = {
    Food: ["🍜", "#f97316"], Transport: ["🚗", "#0ea5e9"], Shopping: ["🛍️", "#ec4899"], Bills: ["💡", "#eab308"],
    Health: ["💊", "#22c55e"], Entertainment: ["🎮", "#8b5cf6"], Other: ["📦", "#64748b"]
  };
  const meta = (c) => META[c] || META.Other;
  const fmt = (n) => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtK = (n) => n >= 1000 ? (n / 1000).toFixed(n % 1000 ? 1 : 0) + "k" : String(Math.round(n));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const niceMax = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };

  const M = DATA.months || [];
  const EMPTY = { ym: "", label: "No data", short: "", total: 0, count: 0, daily: [], categories: [], items: [] };
  const found = M.findIndex((m) => m.ym === DATA.current);
  let idx = M.length ? (found >= 0 ? found : M.length - 1) : -1;
  const CATS = Object.keys(META).concat([...new Set(M.flatMap((m) => m.categories.map((c) => c.name)))].filter((n) => !(n in META)));

  // ---------- month picker
  const sel = $("monthSel");
  M.slice().reverse().forEach((m) => { const o = document.createElement("option"); o.value = m.ym; o.textContent = m.label; sel.appendChild(o); });
  sel.addEventListener("change", () => setMonth(M.findIndex((m) => m.ym === sel.value)));
  $("prev").addEventListener("click", () => setMonth(idx - 1));
  $("next").addEventListener("click", () => setMonth(idx + 1));
  function setMonth(i) { if (i < 0 || i >= M.length) return; idx = i; render(); }

  function countUp(node, to) {            // animated number
    if (reduce || !to) { node.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 700;
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  function render() {
    const m = M[idx] || EMPTY, prev = idx > 0 ? M[idx - 1] : null;
    if (m.ym) sel.value = m.ym;
    $("prev").disabled = idx <= 0; $("next").disabled = idx < 0 || idx >= M.length - 1;
    ["catMonth", "dailyMonth", "txMonth"].forEach((id) => ($(id).textContent = m.label));

    // hero
    $("heroLbl").textContent = m.ym === DATA.current ? "Spent this month" : "Spent in " + m.label;
    $("cur").textContent = DATA.currency;
    $("chipCount").textContent = m.count + (m.count === 1 ? " entry" : " entries");
    $("chipAvg").textContent = "avg " + DATA.currency + " " + fmt(m.count ? m.total / m.count : 0);
    $("chipTop").textContent = m.categories.length ? meta(m.categories[0].name)[0] + " " + m.categories[0].name : "No data yet";
    const chg = $("chipChg");
    if (prev && prev.total > 0) {
      const p = (m.total - prev.total) / prev.total * 100;
      chg.hidden = false; chg.className = "chip " + (p > 0 ? "up" : "down");
      chg.textContent = (p > 0 ? "▲ " : "▼ ") + Math.abs(Math.round(p)) + "% vs " + prev.short;
    } else chg.hidden = true;
    countUp($("total"), m.total);

    // budget ring
    const ringBox = $("ringBox"), arc = $("ringArc");
    if (DATA.budget > 0) {
      ringBox.hidden = false;
      const pct = m.total / DATA.budget, C = 2 * Math.PI * 50;
      $("ringPct").textContent = Math.round(pct * 100) + "%";
      $("ringLbl").textContent = pct > 1 ? "over budget" : DATA.currency + " " + fmt(DATA.budget - m.total) + " left";
      arc.setAttribute("stroke", pct > 1 ? "#fecdd3" : "#fff");
      arc.style.transition = "none"; arc.setAttribute("stroke-dasharray", "0 " + C); void arc.getBoundingClientRect(); arc.style.transition = "";
      setTimeout(() => arc.setAttribute("stroke-dasharray", Math.min(pct, 1) * C + " " + C), 60);
    } else ringBox.hidden = true;

    renderDonut(m); renderTrend(); renderDaily(m); renderTx(m);
  }

  // ---------- donut + legend
  function renderDonut(m) {
    const box = $("donutBox"); box.textContent = "";
    if (!m.categories.length) {
      const e = el("div", "empty"); e.appendChild(el("big", "", "🧾"));
      e.appendChild(document.createTextNode("No expenses in " + m.label + ". Tell the assistant below what you spent!"));
      box.appendChild(e); return;
    }
    const wrap = el("div", "donut-wrap"), donut = el("div", "donut"), legend = el("div", "legend");
    const R = 62, C = 2 * Math.PI * R, svg = sv("svg", { width: 168, height: 168, viewBox: "0 0 168 168" });
    const center = el("div", "center"), cb = el("b", "", DATA.currency + " " + fmt(m.total)), ci = el("i", "", "total");
    center.append(cb, ci);
    const segs = [], rows = [];
    const focus = (i) => {
      segs.forEach((s, j) => { s.setAttribute("stroke-width", i === j ? 26 : 20); s.style.opacity = i === null || i === j ? 1 : .35; });
      rows.forEach((r, j) => r.classList.toggle("on", i === j));
      if (i === null) { cb.textContent = DATA.currency + " " + fmt(m.total); ci.textContent = "total"; }
      else { cb.textContent = DATA.currency + " " + fmt(m.categories[i].total); ci.textContent = m.categories[i].name; }
    };
    let cum = 0;
    m.categories.forEach((c, i) => {
      const share = c.total / m.total, len = share * C, col = meta(c.name)[1];
      const s = sv("circle", { class: "seg", cx: 84, cy: 84, r: R, fill: "none", stroke: col, "stroke-width": 20,
        "stroke-dasharray": Math.max(len - 2, 0.5) + " " + C, "stroke-dashoffset": -cum }, svg);
      s.addEventListener("mouseenter", () => focus(i)); s.addEventListener("mouseleave", () => focus(null));
      segs.push(s); cum += len;
      const row = el("div", "lrow"), dot = el("span", "dot"); dot.style.background = col;
      row.append(dot, el("span", "", meta(c.name)[0] + " " + c.name), el("span", "pc", Math.round(share * 100) + "%"), el("span", "val", fmt(c.total)));
      row.addEventListener("mouseenter", () => focus(i)); row.addEventListener("mouseleave", () => focus(null));
      legend.appendChild(row); rows.push(row);
    });
    donut.append(svg, center); wrap.append(donut, legend); box.appendChild(wrap);
  }

  // ---------- monthly overview (stacked by category, click to open a month)
  function renderTrend() {
    const box = $("trend"), read = $("trendRead"); box.textContent = ""; $("tlegend").textContent = "";
    if (!M.length) { box.appendChild(el("div", "empty", "No history yet.")); return; }
    let start = Math.max(0, M.length - 12); if (idx >= 0 && idx < start) start = idx;
    const view = M.slice(start, start + 12);
    const W = 720, H = 240, L = 46, Rr = 10, T = 14, B = 30, pw = W - L - Rr, ph = H - T - B;
    const peak = Math.max(...view.map((m) => m.total), DATA.budget > 0 ? DATA.budget : 0, 1);
    const top = niceMax(peak * 1.05);
    const svg = sv("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": "Monthly spending by category" }, box);
    svg.style.display = "block";
    for (let i = 0; i <= 5; i++) {
      const v = top * i / 5, y = T + ph - (v / top) * ph;
      sv("line", { x1: L, x2: W - Rr, y1: y, y2: y, stroke: i ? "#e3eefc" : "#bcd8fa", "stroke-width": 1 }, svg);
      const t = sv("text", { x: L - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "#5b7694" }, svg); t.textContent = fmtK(v);
    }
    const slot = pw / view.length, bw = Math.min(46, slot * 0.62), shown = new Set();
    const defaultRead = () => { const m = M[idx]; read.textContent = ""; if (m) read.append(el("b", "", m.label), document.createTextNode(" · " + DATA.currency + " " + fmt(m.total) + " · " + m.count + (m.count === 1 ? " entry" : " entries"))); };
    view.forEach((m, k) => {
      const abs = start + k, isSel = abs === idx, x0 = L + slot * k, gx = x0 + (slot - bw) / 2;
      const g = sv("g", { class: "slot" }, svg);
      sv("rect", { class: "hl", x: x0 + 2, y: T, width: slot - 4, height: ph, rx: 8, fill: isSel ? "rgba(37,99,235,.10)" : "transparent" }, g);
      let y = T + ph;
      CATS.forEach((c) => {
        const v = (m.categories.find((x) => x.name === c) || {}).total || 0; if (!v) return;
        const h = v / top * ph; y -= h; shown.add(c);
        sv("rect", { x: gx, y: y, width: bw, height: Math.max(h, .5), fill: meta(c)[1], opacity: isSel ? 1 : .75 }, g);
      });
      const lab = sv("text", { x: x0 + slot / 2, y: H - 10, "text-anchor": "middle", "font-size": 11, "font-weight": isSel ? 700 : 400, fill: isSel ? "#2563eb" : "#5b7694" }, g);
      lab.textContent = m.short + (k === 0 || m.ym.endsWith("-01") ? " '" + m.ym.slice(2, 4) : "");
      g.addEventListener("click", () => setMonth(abs));
      g.addEventListener("mouseenter", () => { read.textContent = "";
        read.append(el("b", "", m.label), document.createTextNode(" · " + DATA.currency + " " + fmt(m.total) + " · " + m.count + (m.count === 1 ? " entry" : " entries") +
          (m.categories.length ? " · top: " + m.categories[0].name : ""))); });
      g.addEventListener("mouseleave", defaultRead);
    });
    if (DATA.budget > 0 && DATA.budget <= top) {
      const y = T + ph - (DATA.budget / top) * ph;
      sv("line", { x1: L, x2: W - Rr, y1: y, y2: y, stroke: "#e11d48", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, svg);
      const t = sv("text", { x: W - Rr, y: y - 5, "text-anchor": "end", "font-size": 11, fill: "#e11d48" }, svg); t.textContent = "Budget " + fmtK(DATA.budget);
    }
    CATS.filter((c) => shown.has(c)).forEach((c) => {
      const s = el("span"), d = el("i", "dot"); d.style.background = meta(c)[1]; d.style.display = "inline-block";
      s.append(d, document.createTextNode(c)); $("tlegend").appendChild(s);
    });
    defaultRead();
  }

  // ---------- daily bars
  function renderDaily(m) {
    const bars = $("bars"); bars.textContent = ""; $("readout").textContent = "Hover a bar to see the day";
    const max = Math.max(1, ...m.daily);
    m.daily.forEach((v, i) => {
      const b = el("div", "bar" + (v > 0 ? " has" : "") + (m.ym === DATA.current && i + 1 === DATA.today_day ? " today" : ""));
      const h = v > 0 ? Math.max(8, (v / max) * 112) : 4;
      setTimeout(() => (b.style.height = h + "px"), reduce ? 0 : 40 + i * 12);
      b.addEventListener("mouseenter", () => {
        const r = $("readout"); r.textContent = "";
        r.append(el("b", "", m.label.split(" ")[0] + " " + (i + 1)), document.createTextNode(" · " + DATA.currency + " " + fmt(v)));
      });
      bars.appendChild(b);
    });
  }

  // ---------- expenses of the selected month
  function renderTx(m) {
    const tx = $("tx"); tx.textContent = "";
    if (!m.items.length) tx.appendChild(el("div", "empty", "Nothing here yet."));
    m.items.forEach((r) => {
      const [emoji, col] = meta(r.category), row = el("div", "row"), ico = el("div", "ico", emoji);
      ico.style.background = col + "22"; ico.style.border = "1px solid " + col + "55";
      const mid = el("div"); mid.append(el("div", "t", r.note || r.category), el("div", "s", r.category + " · " + r.date + " · #" + r.id));
      row.append(ico, mid, el("div", "a", "−" + DATA.currency + " " + fmt(r.amount)));
      tx.appendChild(row);
    });
  }

  render();
</script>
</body>
</html>
